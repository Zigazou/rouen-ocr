[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rouen-ocr"
version = "0.1.0"
description = "OCR utilities for Rouen"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Rouen OCR contributors" },
]
dependencies = [
  "beautifulsoup4>=4.11",
  "ollama>=0.6.0",
  "pydantic>=2.0",
  "pypdfium2>=4.30",
]

[project.scripts]
pdf-to-images = "rouen_ocr.pdf_to_images:main"
pdf-to-text = "rouen_ocr.pdf_to_text:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "ollama>=0.6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rouen_ocr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
